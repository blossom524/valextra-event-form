<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="apple-touch-icon" sizes="180x180" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <meta name="apple-mobile-web-app-title" content="【Afternoon Tea in Tokyo】回答フォーム">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      width: min(88%, 420px);
      text-align: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 26px;
      text-align: center;
      margin: 0 0 25px;
      line-height: 1.4;
    }

    h1 span {
      display: block;
    }

    img {
      width: 200px;
      height: 200px;
      border-radius: 40px;
      object-fit: cover;
      margin: 0;
    }

    .intro {
      margin-top: 48px;
      margin-bottom: 48px;
      line-height: 1.7;
      text-align: center;
    }

    .steps {
      width: calc(100% - 40px);
      margin-left: 40px;
      margin-right: 0;
      text-align: left;
    }

    .step {
      display: flex;
      align-items: flex-start;
      margin-bottom: 32px;
      line-height: 1.7;
      text-align: left;
    }

    /* モバイルでは2番の下だけ広め */
    .step.extra-space {
      margin-bottom: 58px;
    }

    .step-number {
      flex: 0 0 28px;
    }

    .step-text {
      flex: 1;
      min-width: 0;
    }

    .complete {
      margin-top: 48px;
      margin-bottom: 48px;
      line-height: 1.7;
      text-align: center;
    }

    a {
      display: block;
      padding: 16px 18px;
      border-radius: 14px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
    }

    /* PC版 */
    @media (min-width: 768px) {
      .step.extra-space {
        margin-bottom: 32px;
      }
    }
  </style>
</head>

<body>

  <main>

    <h1>
      <span>【Afternoon Tea in Tokyo】</span>
      <span>回答フォーム</span>
    </h1>

    <img src="./icon.png" alt="Valextra">

    <p class="intro">
      初めての場合は下記を行ってください
    </p>

    <div class="steps">

      <div class="step">
        <div class="step-number">1.</div>
        <div class="step-text">
          Safariのメニュー「・・・」から共有を押下
        </div>
      </div>

      <div class="step extra-space">
        <div class="step-number">2.</div>
        <div class="step-text">
          「ホーム画面に追加」をタップ
        </div>
      </div>

      <div class="step">
        <div class="step-number">3.</div>
        <div class="step-text">
          ホームに追加されたことを確認してください
        </div>
      </div>

      <div class="step">
        <div class="step-number">4.</div>
        <div class="step-text">
          店舗または自身のMicrosoftアドレスでログイン
        </div>
      </div>

    </div>

    <p class="complete">
      初期設定完了です
    </p>

    <a href="https://forms.cloud.microsoft/r/8kYdgJfQ5t">
      フォームに記入する
    </a>

  </main>

</body>

</html>
